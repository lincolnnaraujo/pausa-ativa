# Serve o build do Vite e encaminha a API para o backend (spec H1, seção 6.3).
# Imagem nginx-unprivileged: roda sem root e por isso escuta na 8080.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker, consultado a cada requisição (o "set" abaixo força isso).
    # Assim o nginx sobe mesmo com o backend fora, e acompanha o backend se o IP dele mudar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Arquivos com hash no nome, gerados pelo Vite: podem ficar em cache para sempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Já preparado para o SSE da H2: sem buffer e conexão longa.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Do Actuator, só o health chega ao host.
    location = /actuator/health {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # O resto do Actuator (info, prometheus...) fica na rede interna. Sem esta regra, a rota cairia
    # no fallback do SPA e responderia 200 com o index.html.
    location /actuator/ {
        return 404;
    }
}
