# Pausa Ativa: sobe a aplicação inteira com `docker compose up -d --wait`.
# Antes, copie o .env.example para .env. A aplicação abre em http://127.0.0.1:${FRONTEND_PORT}.
#
# Só o frontend e o Grafana têm porta no host, e só em 127.0.0.1. O nginx do frontend encaminha /api/
# e /actuator/health para o backend; o Postgres e o Prometheus ficam acessíveis apenas na rede interna.

name: pausa-ativa

# Credenciais do banco, lidas do .env. Um bloco só, usado pelo Postgres e pelo backend.
x-credenciais-banco: &credenciais-banco
  POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env (copie o .env.example)}
  POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env (copie o .env.example)}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie o .env.example)}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: *credenciais-banco
    volumes:
      # A partir do Postgres 18 o volume vai em /var/lib/postgresql (os dados ficam em 18/docker).
      # Montar em /var/lib/postgresql/data, como nas versões anteriores, faz a subida falhar.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *credenciais-banco
      DB_HOST: postgres
    # A JVM usa 75% desse limite (Dockerfile).
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    # Healthcheck definido no Dockerfile: liveness, que não depende do banco.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-38742}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # Coleta as métricas do backend a cada 15 s (spec H5, seção 3.1). Sem porta no host: o Grafana o lê
  # pela rede interna. O backend não depende dele, e com o backend fora a métrica "up" vira 0.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 dias ou 1 GB, o que vier primeiro (D4). O histórico de negócio fica no banco, sem limite.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dados:/prometheus
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Painel "Pausa Ativa" em http://127.0.0.1:${GRAFANA_PORT} (spec H5, seção 3.2). A fonte de dados e o
  # painel vêm dos arquivos de observabilidade/grafana; o acesso é anônimo, só de leitura, sem login (D3).
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-38744}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/paineis/pausa-ativa.json
      # Tema escuro e português, como a aplicação (D10).
      GF_USERS_DEFAULT_THEME: dark
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      # Nada sai para a internet: o épico não depende de serviço externo.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Sem alertas nesta versão (spec H5, seção 2): o motor de alertas só gastaria memória.
      GF_UNIFIED_ALERTING_ENABLED: "false"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/paineis:/etc/grafana/paineis:ro
      - grafana-dados:/var/lib/grafana
    # O Grafana 13 usa uns 250 MB só de memória própria: com 256 MB, vivia no limite.
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  pgdata:
  prometheus-dados:
  grafana-dados:
