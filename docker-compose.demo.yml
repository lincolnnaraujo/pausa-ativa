# Modo demonstração: um lembrete de água por minuto e um bloco de exercício a cada 2 min de tempo
# trabalhado, para testar o dia inteiro em cerca de 16 min (spec H2, seção 9; spec H3, seção 9). Na
# primeira subida, o banco ganha 45 dias de histórico de exemplo, para o Histórico ter o que mostrar
# (spec H4, seção 9).
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --wait
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
#
# Roda como outro projeto, com banco e porta próprios: uma jornada de teste não ocupa o dia de hoje na
# aplicação real (é uma jornada por dia). Abre em http://127.0.0.1:38743, e o painel de métricas, em
# http://127.0.0.1:38745.

name: pausa-ativa-demo

services:
  backend:
    environment:
      PAUSA_ATIVA_INTERVALO: 1m
      PAUSA_ATIVA_DEMO_HISTORICO: "true"

  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT_DEMO:-38743}:8080"

  # O painel da demonstração (spec H5, seção 6): começa vazio e enche com o dia ao vivo, porque o histórico
  # de exemplo não passa pelas métricas.
  grafana:
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT_DEMO:-38745}:3000"
