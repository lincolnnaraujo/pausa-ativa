# Atualizações semanais de dependências (spec H1, seção 8).
# Correções e versões menores vêm agrupadas num PR por ecossistema; versões maiores, em PRs separados.

version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-menores:
        update-types: [minor, patch]
    ignore:
      # O vue-tsc ainda depende da API JS do compilador, que o TypeScript 7 (port nativo) não oferece.
      # Rever quando o vue-tsc declarar suporte (spec H1, seção 4).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
