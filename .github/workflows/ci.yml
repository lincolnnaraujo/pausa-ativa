name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, testes, arquitetura, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Spotless, testes (Testcontainers usa o Docker do runner), ArchUnit,
      # contrato OpenAPI e JaCoCo com mínimo de 80%.
      - name: Verificar
        run: ./mvnw -B -ntp verify

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tipos, testes, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # Os tipos do frontend vêm do contrato do backend (docs/api/openapi.json).
      - name: Conferir tipos gerados do contrato
        run: |
          npm run contrato
          git diff --exit-code -- src/api/contrato.ts \
            || { echo "::error::src/api/contrato.ts desatualizado. Rode 'npm run contrato' no frontend e commite."; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Checar tipos
        run: npm run typecheck

      # Vitest com mínimo de 80% de linhas.
      - name: Testar
        run: npm test

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore

  compose:
    name: Subida com docker compose (Cenário 1)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Mesmo passo a passo do README.
      - name: Criar o .env a partir do exemplo
        run: cp .env.example .env

      - name: Subir a stack e aguardar todos os serviços saudáveis
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Conferir página, API e health pelo nginx
        run: |
          set -euo pipefail
          porta=$(grep '^FRONTEND_PORT=' .env | cut -d= -f2)
          base="http://127.0.0.1:${porta}"

          curl -fsS "$base/" | grep -q '<title>Pausa Ativa</title>'
          curl -fsS "$base/api/v1/sistema/status" | tee /dev/stderr | grep -q '"aplicacao":"pausa-ativa"'
          echo
          curl -fsS "$base/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'
          echo
          # O resto do Actuator, inclusive o /actuator/prometheus, não chega ao host.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/actuator/prometheus")" = 404

      # Cenário 1 da H5: o Prometheus coleta o backend pela rede interna, com os histogramas da spec H5,
      # seção 5. A requisição do passo anterior já gerou a faixa de 200 ms; a coleta é a cada 15 s.
      - name: Conferir a coleta do Prometheus
        run: |
          set -euo pipefail
          consultar() {
            docker compose exec -T prometheus wget -qO- \
              "http://localhost:9090/api/v1/query?query=$(jq -rn --arg q "$1" '$q | @uri')" \
              | jq -r '.data.result[0].value[1] // "0"'
          }
          for _ in $(seq 1 12); do
            alvo=$(consultar 'up{job="pausa-ativa"}')
            faixas=$(consultar 'count(http_server_requests_seconds_bucket{application="pausa-ativa",le="0.2"})')
            if [ "$alvo" = "1" ] && [ "$faixas" != "0" ]; then
              echo "Backend coletado, com a faixa de 200 ms em $faixas séries"
              exit 0
            fi
            sleep 5
          done
          echo "::error::O Prometheus não coletou o backend: up=$alvo, séries com a faixa de 200 ms=$faixas"
          exit 1

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
