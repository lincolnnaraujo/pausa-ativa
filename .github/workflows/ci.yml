name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, testes, arquitetura, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Spotless, testes (Testcontainers usa o Docker do runner), ArchUnit,
      # contrato OpenAPI e JaCoCo com mínimo de 80%.
      - name: Verificar
        run: ./mvnw -B -ntp verify

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tipos, testes, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Checar tipos
        run: npm run typecheck

      # Vitest com mínimo de 80% de linhas.
      - name: Testar
        run: npm test

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore

  compose:
    name: Subida com docker compose (Cenário 1)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Mesmo passo a passo do README.
      - name: Criar o .env a partir do exemplo
        run: cp .env.example .env

      - name: Subir a stack e aguardar todos os serviços saudáveis
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Conferir página, API e health pelo nginx
        run: |
          set -euo pipefail
          porta=$(grep '^FRONTEND_PORT=' .env | cut -d= -f2)
          base="http://127.0.0.1:${porta}"

          curl -fsS "$base/" | grep -q '<title>Pausa Ativa</title>'
          curl -fsS "$base/api/v1/sistema/status" | tee /dev/stderr | grep -q '"aplicacao":"pausa-ativa"'
          echo
          curl -fsS "$base/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
