spring:
  application:
    name: pausa-ativa
  datasource:
    # Credenciais vêm do .env (as mesmas do container do Postgres). DB_HOST=postgres no compose.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pausaativa}
    username: ${POSTGRES_USER:pausaativa}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Timeouts curtos para o /actuator/health ficar DOWN rápido com o banco fora.
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # Só /actuator/health chega ao host (via nginx). info e prometheus ficam na rede interna.
        include: health, info, prometheus
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

logging:
  structured:
    format:
      console: ecs
