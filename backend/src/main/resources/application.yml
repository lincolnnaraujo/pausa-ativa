spring:
  application:
    name: pausa-ativa
  threads:
    virtual:
      # As conexões SSE ficam abertas o dia todo; com threads virtuais, não prendem threads do sistema.
      enabled: true
  datasource:
    # Credenciais vêm do .env (as mesmas do container do Postgres). DB_HOST=postgres no compose.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pausaativa}
    username: ${POSTGRES_USER:pausaativa}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Timeouts curtos para o /actuator/health ficar DOWN rápido com o banco fora.
      connection-timeout: 3000
      validation-timeout: 2000
      data-source-properties:
        # Limite de leitura no socket do driver, em segundos. Sem ele, um banco que não responde
        # (rede caída, container congelado) prende a thread para sempre: o health checa a conexão
        # com isValid(0), que o driver trata como "sem timeout". Nenhuma consulta legítima chega perto.
        socketTimeout: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      # Erros do framework (id inválido, JSON malformado) também saem em application/problem+json.
      enabled: true

springdoc:
  # Só a API de negócio entra no contrato; chaves ordenadas deixam o docs/api/openapi.json estável.
  paths-to-match: /api/**
  writer-with-order-by-keys: true

pausa-ativa:
  agenda:
    # Tempo trabalhado entre os lembretes de água; o exercício usa o dobro (D9 da H3). O modo
    # demonstração (docker-compose.demo.yml) usa 1m.
    intervalo: ${PAUSA_ATIVA_INTERVALO:30m}
    agendador:
      # Tick de 1 s e heartbeat do SSE. Desligado nos testes, que avançam a agenda à mão.
      habilitado: true
  demonstracao:
    # Na subida, cria jornadas de exemplo nos 45 dias anteriores a hoje, se o banco não tiver jornada de
    # dia anterior (spec H4, seção 9). Só o docker-compose.demo.yml liga.
    historico: ${PAUSA_ATIVA_DEMO_HISTORICO:false}

management:
  endpoints:
    web:
      exposure:
        # Só /actuator/health chega ao host (via nginx). info e prometheus ficam na rede interna.
        include: health, info, prometheus
  metrics:
    tags:
      # Identifica a aplicação nas séries do Prometheus (spec H5, seção 5).
      application: pausa-ativa
    distribution:
      # Histogramas nas métricas de tempo, para o painel do Grafana mostrar o p95 contra os limites do
      # épico (spec H5, seção 5). O teto corta as faixas longas; o slo garante uma faixa no limite.
      percentiles-histogram:
        http.server.requests: true
        pausaativa.marcos.atraso.disparo: true
        pausaativa.historico.consultas: true
      # As chaves valem por prefixo: http.server.requests também pega o http.server.requests.active, de
      # tarefas longas, cujo mínimo padrão é de 2 min. Sem um mínimo menor, o teto de 5 s fica abaixo dele,
      # e o Micrometer recusa a configuração na primeira requisição.
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 5s
        pausaativa.marcos.atraso.disparo: 30s
        pausaativa.historico.consultas: 5s
      slo:
        # p95 < 200 ms nas operações de marco
        http.server.requests: 200ms
        # Notificação em até 5 s do instante calculado
        pausaativa.marcos.atraso.disparo: 1s,5s
        # Agregação mensal < 500 ms
        pausaativa.historico.consultas: 500ms
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

logging:
  structured:
    format:
      console: ecs
