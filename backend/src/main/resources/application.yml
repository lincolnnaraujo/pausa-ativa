spring:
  application:
    name: pausa-ativa
  datasource:
    # Credenciais vêm do .env (as mesmas do container do Postgres). DB_HOST=postgres no compose.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pausaativa}
    username: ${POSTGRES_USER:pausaativa}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Timeouts curtos para o /actuator/health ficar DOWN rápido com o banco fora.
      connection-timeout: 3000
      validation-timeout: 2000
      data-source-properties:
        # Limite de leitura no socket do driver, em segundos. Sem ele, um banco que não responde
        # (rede caída, container congelado) prende a thread para sempre: o health checa a conexão
        # com isValid(0), que o driver trata como "sem timeout". Nenhuma consulta legítima chega perto.
        socketTimeout: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

springdoc:
  # Só a API de negócio entra no contrato; chaves ordenadas deixam o docs/api/openapi.json estável.
  paths-to-match: /api/**
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        # Só /actuator/health chega ao host (via nginx). info e prometheus ficam na rede interna.
        include: health, info, prometheus
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

logging:
  structured:
    format:
      console: ecs
